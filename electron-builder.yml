appId: com.moonstack.qingying
productName: 轻影
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
# 托盘/窗口运行时图标（打包后位于 process.resourcesPath/icons）
extraResources:
  - from: resources
    to: icons
    filter:
      - icon-16.png
      - icon-24.png
      - icon-32.png
      - icon-48.png
      - icon-64.png
      - icon-128.png
      - icon-256.png
      - icon.ico
      - icon.png
# 自动更新：从 GitHub Releases 拉取 latest.yml / 安装包
publish:
  provider: github
  owner: moon-stack-OAo
  repo: qingying
  releaseType: release
# 品牌图标：build/icon.ico（Win）/ build/icon.png（通用源）
win:
  icon: build/icon.ico
  # 可执行文件/安装包使用 ASCII 名称，避免中文路径与 CI 上传问题；界面仍用 productName
  executableName: qingying
  target:
    - target: nsis
      arch:
        - x64
  artifactName: qingying-${version}-win-${arch}.${ext}
  # 代码签名占位（有证书时再启用，勿在无证书 CI 强制签名）
  # sign: path/to/sign-tool-or-custom-script
  # certificateFile: path/to/cert.pfx
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # signingHashAlgorithms: [sha256]
mac:
  icon: build/icon.png
  # 与 Windows 一致使用 ASCII 产物名，避免中文路径问题
  executableName: qingying
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: qingying-${version}-mac-${arch}.${ext}
  category: public.app-category.video
  # 签名/公证占位（有 Apple Developer 证书时再配置；无证书时保持不强制）
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 轻影
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 便于 electron-updater 差分/覆盖安装
  differentialPackage: true
