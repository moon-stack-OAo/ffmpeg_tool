<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img"
     aria-label="FFmpeg 视频压缩工具">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B4DFF"/>
            <stop offset="55%" stop-color="#0EA5E9"/>
            <stop offset="100%" stop-color="#14B8A6"/>
        </linearGradient>
        <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
            <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0B1B4A" flood-opacity="0.28"/>
        </filter>
    </defs>
    
    <!-- 圆角方底 -->
    <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)" filter="url(#softShadow)"/>
    <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
    
    <!-- 胶片外框 -->
    <rect x="230" y="250" width="564" height="420" rx="56" fill="#0B1738" fill-opacity="0.22"/>
    <rect x="252" y="272" width="520" height="376" rx="44" fill="#FFFFFF" fill-opacity="0.96"/>
    
    <!-- 胶片两侧齿孔 -->
    <g fill="#0EA5E9" fill-opacity="0.85">
        <rect x="278" y="304" width="36" height="36" rx="10"/>
        <rect x="278" y="372" width="36" height="36" rx="10"/>
        <rect x="278" y="440" width="36" height="36" rx="10"/>
        <rect x="278" y="508" width="36" height="36" rx="10"/>
        <rect x="710" y="304" width="36" height="36" rx="10"/>
        <rect x="710" y="372" width="36" height="36" rx="10"/>
        <rect x="710" y="440" width="36" height="36" rx="10"/>
        <rect x="710" y="508" width="36" height="36" rx="10"/>
    </g>
    
    <!-- 画面区 -->
    <rect x="340" y="310" width="344" height="300" rx="28" fill="url(#bg)"/>
    
    <!-- 播放三角（压缩感：略小、居中） -->
    <path d="M470 380 L470 540 L610 460 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- 压缩箭头：向内收束 -->
    <g fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
        <path d="M340 760 L430 760"/>
        <path d="M390 720 L430 760 L390 800"/>
        <path d="M684 760 L594 760"/>
        <path d="M634 720 L594 760 L634 800"/>
    </g>
    
    <!-- 中间压缩指示条 -->
    <rect x="456" y="742" width="112" height="36" rx="18" fill="url(#accent)"/>
</svg>
